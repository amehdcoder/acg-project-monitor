name: E2E — KoboCollect Realtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  kobo-realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run KoboCollect realtime E2E
        env:
          KOBO_WEBHOOK_URL: ${{ secrets.KOBO_WEBHOOK_URL }}
          KOBO_WEBHOOK_SECRET: ${{ secrets.KOBO_WEBHOOK_SECRET }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON: ${{ secrets.E2E_SUPABASE_ANON }}
          E2E_PROJECT_ID: ${{ secrets.E2E_PROJECT_ID }}
          E2E_ACCESS_TOKEN: ${{ secrets.E2E_ACCESS_TOKEN }}
          E2E_REFRESH_TOKEN: ${{ secrets.E2E_REFRESH_TOKEN }}
        run: npx playwright test tests/e2e/kobo-microplan-realtime.spec.ts --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
